name: CI

# Fast correctness gate for every branch and pull request. Release packaging is
# handled separately by release.yml when a version tag is pushed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version number lives in six files and is bumped by hand, so one of
      # them gets missed sooner or later -- Cargo.toml sat at 4.3.8 through the
      # whole 4.3.9 release, which would have stamped the wrong version into
      # the shipped binary. Stdlib-only, so it needs no install step and fails
      # in seconds.
      - name: Check version consistency
        run: python scripts/check_version_consistency.py

      - name: Validate automatic patch version bump
        run: python scripts/bump_patch_version.py --pr-number 0 --dry-run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Python was the only language here without a linter -- Rust has clippy,
      # the frontend has svelte-check. Rules live in ruff.toml, not in this
      # file, so a local run and CI cannot disagree about what is enforced.
      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          # Same file a contributor installs from, so CI and a local checkout
          # cannot drift into testing different things.
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --prefix frontend

      - name: svelte-check
        run: npm run check --prefix frontend

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libappindicator3-dev \
            patchelf

      # tauri-build's build.rs fails cargo check/clippy outright if the
      # bundle.resources path in tauri.conf.json doesn't exist on disk, so the
      # sidecar has to be built first even though we're not producing an
      # installer here (matches the step in release.yml).
      - name: Build Python engine sidecar (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller yt-dlp mutagen brotli certifi requests websockets
          pyinstaller packaging/engine_sidecar.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  weekly-preview-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v5
        with:
          ref: Multimedia_Downloader_Web_Preview
          path: preview

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - name: Install preview dependencies
        working-directory: preview
        run: npm ci --no-audit --no-fund

      - name: Build preview site
        working-directory: preview
        run: npm run build

      - name: Check deployed Pages site
        run: |
          status="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 10 --retry-connrefused --max-time 30 --output page.html --write-out '%{http_code}' https://spacesquare640.github.io/Multimedia_Downloader/)"
          test "$status" = "200"
          grep -Fq '<title>Multimedia Downloader — project field guide</title>' page.html
